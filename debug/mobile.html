<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sori responsive review</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e9ef;color:#24232b;font:14px system-ui}header{display:flex;gap:16px;align-items:center;justify-content:center;min-height:56px;padding:10px;flex-wrap:wrap}label{display:flex;gap:8px;align-items:center}select{font:inherit;padding:8px;border:1px solid #c5c3cf;border-radius:8px;background:white}iframe{display:block;width:390px;height:844px;margin:0 auto 30px;border:0;background:white;box-shadow:0 10px 40px #211c3920}p{margin:0;font-size:12px;color:#605d70}</style><header><label>Review width<select id="width"><option value="360">360 px · compact phone</option><option value="390" selected>390 px · phone</option><option value="430">430 px · large phone</option><option value="768">768 px · tablet</option><option value="1100">1100 px · desktop</option></select></label><p>Responsive browser frame. This does not emulate phone hardware.</p></header><iframe id="preview" src="/" title="Sori responsive preview"></iframe><script>document.getElementById('width').addEventListener('change',e=>{document.getElementById('preview').style.width=e.target.value+'px';});</script></html>
